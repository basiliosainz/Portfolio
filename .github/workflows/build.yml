name: Build pages from media/

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build project pages
        run: npm run build

      - name: Commit regenerated pages (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html contact.html *.html
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Auto-build pages from media/ [skip ci]"
          git push
